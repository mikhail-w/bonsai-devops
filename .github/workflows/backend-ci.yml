name: Backend CI

on:
  push:
    branches: [ cicd-testing ]
    paths:
      - 'apps/backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bonsai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd apps/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/bonsai_test
        SECRET_KEY: test_secret_key
        DEBUG: True
        ENVIRONMENT: development
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        cd apps/backend
        python manage.py test

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build Docker image
      run: |
        cd apps/backend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bonsai-backend:${{ github.sha }} .
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bonsai-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/bonsai-backend:latest

    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bonsai-backend:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/bonsai-backend:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/bonsai-backend:latest