apiVersion: v1
kind: ConfigMap
metadata:
  name: bonsai-config
  namespace: bonsai
data:
  # Environment
  ENVIRONMENT: "development"
  DOMAIN_NAME: "localhost"
  DEBUG: "True"
  
  # API URLs
  API_BASE_URL: "http://bonsai-backend:8000"
  VITE_API_BASE_URL: "http://localhost:8000"
  VITE_API_URL: "http://localhost:8000/api"
  VITE_MEDIA_URL: "http://localhost:8000/media"
  VITE_STATIC_URL: "http://localhost:8000/static"
  
  # Database
  DB_NAME: "bonsai_store"
  DB_USER: "postgres"
  DB_HOST: "bonsai-postgres"
  DB_PORT: "5432"
  
  # Security - Fixed CORS settings
  ALLOWED_HOSTS: "localhost,127.0.0.1,backend,bonsai-backend,bonsai.local,*.local,*"
  CORS_ALLOWED_ORIGINS: "http://localhost:8090,http://127.0.0.1:8090,http://localhost:8000,http://127.0.0.1:8000,http://bonsai-frontend"
  CORS_ALLOW_ALL_ORIGINS: "True"
  CSRF_TRUSTED_ORIGINS: "http://localhost:8090,http://127.0.0.1:8090,http://localhost:8000,http://127.0.0.1:8000"
  
  # Authentication
  VITE_AUTH_TOKEN_KEY: "bonsai_auth_token"
  VITE_REFRESH_TOKEN_KEY: "bonsai_refresh_token"
  
  # Feature flags
  VITE_ENABLE_CHAT: "true"
  VITE_ENABLE_REVIEWS: "true"
  VITE_ENABLE_BLOG: "true"
  
  # Data loading
  LOAD_INITIAL_DATA: "True"