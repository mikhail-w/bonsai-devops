apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonsai-postgres
  namespace: bonsai
  labels:
    app: bonsai
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bonsai
      tier: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bonsai
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:13-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: bonsai-config
            - secretRef:
                name: bonsai-secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: bonsai-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bonsai-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bonsai-config
                  key: DB_NAME
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data-pvc