apiVersion: v1
kind: ConfigMap
metadata:
  name: bonsai-config
  namespace: bonsai
data:
  # Environment
  ENVIRONMENT: "production"
  DOMAIN_NAME: "bonsai.example.com"  # Update as needed
  DEBUG: "False"
  
  # API URLs for EKS deployment - Using backend ALB hostname for API calls
  API_BASE_URL: "{{LOAD_BALANCER_URL}}"
  VITE_API_BASE_URL: "{{LOAD_BALANCER_URL}}"
  VITE_API_URL: "{{LOAD_BALANCER_URL}}/api"
  VITE_MEDIA_URL: "{{LOAD_BALANCER_URL}}/media"
  VITE_STATIC_URL: "{{LOAD_BALANCER_URL}}/static"
  
  # Database - RDS connection
  DB_NAME: "bonsai_store"
  DB_USER: "postgres"
  DB_HOST: "{{RDS_ENDPOINT}}"
  DB_PORT: "5432"
  
  # Security
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "{{LOAD_BALANCER_URL}}"
  CORS_ALLOW_ALL_ORIGINS: "True"
  CORS_ALLOW_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOW_HEADERS: "*"
  CORS_ALLOW_CREDENTIALS: "True"
  CSRF_TRUSTED_ORIGINS: "{{LOAD_BALANCER_URL}}"
  SECURE_SSL_REDIRECT: "False"
  USE_X_FORWARDED_HOST: "True"
  SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,http"
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  SECURE_HSTS_SECONDS: "0"
  
  # Authentication
  VITE_AUTH_TOKEN_KEY: "bonsai_auth_token"
  VITE_REFRESH_TOKEN_KEY: "bonsai_refresh_token"
  
  # Feature flags
  VITE_ENABLE_CHAT: "true"
  VITE_ENABLE_REVIEWS: "true"
  VITE_ENABLE_BLOG: "true"
  
  # Data loading
  LOAD_INITIAL_DATA: "True"
  
  # Storage configuration
  USE_LOCAL_FILE_STORAGE: "True"
  DISABLE_AWS_STORAGE: "True"
  # Ensure media files are correctly identified by Django
  MEDIA_URL: "/media/"
  STATIC_URL: "/static/"