apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: bonsai
spec:
  accessModes:
    - ReadWriteOnce  
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-pvc
  namespace: bonsai
spec:
  accessModes:
    - ReadWriteOnce  
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 500Mi